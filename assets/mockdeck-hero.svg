<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title description">
  <title id="title">Mockdeck — ASCII interface exploration for Pi</title>
  <desc id="description">A dark terminal workspace showing four colorful ASCII interface concepts in a Mockdeck gallery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset="0.52" stop-color="#12152a"/>
      <stop offset="1" stop-color="#17112b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68e0cf"/>
      <stop offset="0.55" stop-color="#8b9dff"/>
      <stop offset="1" stop-color="#c58bff"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20243a"/>
      <stop offset="1" stop-color="#151827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#02040d" flood-opacity="0.65"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <clipPath id="terminalClip"><rect x="90" y="206" width="1220" height="520" rx="18"/></clipPath>
  </defs>

  <rect width="1400" height="800" fill="url(#background)"/>
  <circle cx="245" cy="105" r="130" fill="#42d6c3" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1190" cy="615" r="190" fill="#9c68ff" opacity="0.10" filter="url(#glow)"/>
  <path d="M0 690 C330 600 560 770 890 670 S1240 610 1400 655 V800 H0Z" fill="#706cff" opacity="0.035"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(90 62)">
      <rect width="54" height="54" rx="13" fill="url(#accent)"/>
      <path d="M14 17h26M14 27h17M14 37h22" stroke="#0d1020" stroke-width="4" stroke-linecap="round"/>
      <text x="72" y="39" fill="#f3f5ff" font-size="44" font-weight="750" letter-spacing="-1.5">Mockdeck</text>
    </g>
    <text x="90" y="163" fill="#aeb5cc" font-size="23">Explore interface directions with your agent — without leaving Pi.</text>
    <g transform="translate(1028 92)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <rect width="282" height="44" rx="22" fill="#20253d" stroke="#3b4262"/>
      <circle cx="24" cy="22" r="5" fill="#68e0cf"/>
      <text x="40" y="28" fill="#cbd1e3">/mockup your next idea</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="206" width="1220" height="520" rx="18" fill="url(#terminal)" stroke="#444c70" stroke-width="2"/>
    <g clip-path="url(#terminalClip)">
      <rect x="90" y="206" width="1220" height="54" fill="#272c45"/>
      <circle cx="120" cy="233" r="6" fill="#ff718b"/>
      <circle cx="141" cy="233" r="6" fill="#ffc65c"/>
      <circle cx="162" cy="233" r="6" fill="#66d99c"/>
      <text x="198" y="239" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#747d9d">pi · mockdeck · gallery</text>

      <rect x="90" y="260" width="1220" height="55" fill="#1a1e31"/>
      <text x="118" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#68e0cf">MOCKDECK</text>
      <rect x="245" y="274" width="102" height="28" rx="7" fill="#68e0cf" opacity="0.14"/>
      <text x="261" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8de9dc">Gallery</text>
      <text x="372" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8991ad">Preview</text>
      <text x="466" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8991ad">Notes</text>
      <text x="1178" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#727b99">4 concepts</text>

      <line x1="378" y1="315" x2="378" y2="672" stroke="#3d4565"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
        <rect x="104" y="338" width="260" height="42" rx="8" fill="#303957"/>
        <path d="M120 352l10 7-10 7z" fill="#68e0cf"/>
        <text x="140" y="364" fill="#dce1ef">01  Operations</text>
        <text x="120" y="410" fill="#9098b4">02  Guided flow</text>
        <text x="120" y="449" fill="#9098b4">03  Split inspector</text>
        <text x="120" y="488" fill="#9098b4">04  Command palette</text>
        <text x="120" y="550" fill="#555e7d">TAGS</text>
        <text x="120" y="580" fill="#8b9dff">#dashboard</text>
        <text x="120" y="608" fill="#c58bff">#desktop</text>
        <text x="120" y="636" fill="#68e0cf">#test</text>
      </g>

      <g transform="translate(410 341)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="0" y="0" fill="#eef1fa" font-size="18" font-weight="700">Operations workspace</text>
        <text x="0" y="27" fill="#737c9a" font-size="14">Status-first dashboard · 92 × 22</text>

        <rect x="0" y="52" width="842" height="254" rx="10" fill="#121624" stroke="#58617f"/>
        <text x="24" y="86" fill="#68e0cf" font-size="16">ENERGY CONTROL</text>
        <text x="684" y="86" fill="#66d99c" font-size="14">● All systems healthy</text>
        <line x1="20" y1="105" x2="822" y2="105" stroke="#343b58"/>

        <g transform="translate(24 130)">
          <rect width="234" height="100" rx="8" fill="#1d2236" stroke="#343c5a"/>
          <text x="16" y="27" fill="#818aa6" font-size="13">ACTIVE USERS</text>
          <text x="16" y="67" fill="#f0f2fa" font-size="30" font-weight="700">1,240</text>
          <text x="154" y="67" fill="#66d99c" font-size="13">+8.2%</text>
        </g>
        <g transform="translate(282 130)">
          <rect width="234" height="100" rx="8" fill="#1d2236" stroke="#343c5a"/>
          <text x="16" y="27" fill="#818aa6" font-size="13">PUBLISHED CONCEPTS</text>
          <text x="16" y="67" fill="#f0f2fa" font-size="30" font-weight="700">04</text>
          <text x="154" y="67" fill="#8b9dff" font-size="13">ready</text>
        </g>
        <g transform="translate(540 130)">
          <rect width="278" height="100" rx="8" fill="#1d2236" stroke="#343c5a"/>
          <text x="16" y="27" fill="#818aa6" font-size="13">VALIDATION</text>
          <text x="16" y="64" fill="#66d99c" font-size="18">✓ geometry</text>
          <text x="145" y="64" fill="#66d99c" font-size="18">✓ colors</text>
        </g>

        <text x="18" y="286" fill="#ffc65c" font-size="13">⚡ Compare directions before writing production code.</text>
      </g>

      <rect x="90" y="672" width="1220" height="54" fill="#181c2d"/>
      <text x="118" y="705" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#777f9c">↑↓ select   Tab view   G generate   U use   C copy   E export   Esc close</text>
      <rect x="1135" y="688" width="145" height="24" rx="12" fill="#8b9dff" opacity="0.15"/>
      <text x="1153" y="705" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#aeb9ff">theme-aware</text>
    </g>
  </g>

  <text x="700" y="770" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#565e79">ASCII-native · keyboard-first · safe semantic color · open source</text>
</svg>
